<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Gjallar Architecture: Surprise-Gated Sparse KV Retrieval with Host-RAM Offloading and S8 Quantized Index"><style>
  .bg{fill:#ffffff}.fg{fill:#172033}.mu{fill:#5b6577}.ln{stroke:#d5dae3}.st{stroke:#172033}
  .dn{fill:#c9ced8}.win{fill:#c47a12}.mem{fill:#0f8a80}.keep{fill:#6b4bd6}.sink{fill:#b4384f}.orig{fill:#8a93a3}
  .twin{fill:#fbefdc}.tmem{fill:#dcf3f0}.tkeep{fill:#ebe5fb}.box{fill:#f6f7f9}.alert{fill:#fbe8eb}
  .swin{stroke:#c47a12}.smem{stroke:#0f8a80}.skeep{stroke:#6b4bd6}.salert{stroke:#b4384f}
  text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){
    .bg{fill:#0d1117}.fg{fill:#e6e9ef}.mu{fill:#9aa4b5}.ln{stroke:#2c3442}.st{stroke:#e6e9ef}
    .dn{fill:#3a414d}.win{fill:#e6a03c}.mem{fill:#3cc4b7}.keep{fill:#a08bff}.sink{fill:#ef6f86}.orig{fill:#6b7484}
    .twin{fill:#3a2b14}.tmem{fill:#12332f}.tkeep{fill:#2a2346}.box{fill:#161b22}.alert{fill:#381a22}
    .swin{stroke:#e6a03c}.smem{stroke:#3cc4b7}.skeep{stroke:#a08bff}.salert{stroke:#ef6f86}
  }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="fg"/>
  </marker>
  <marker id="arr-keep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="keep"/>
  </marker>
  <marker id="arr-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="mem"/>
  </marker>
  <marker id="arr-win" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="win"/>
  </marker>
</defs>

<rect width="960" height="520" rx="12" class="bg"/>

<!-- Header -->
<text x="28" y="34" font-size="16" class="fg" font-weight="700">Gjallar Architecture: Surprise-Gated Retrieval Attention (SGRA)</text>
<text x="28" y="54" font-size="12" class="mu">Design study: 1M-token context with exact KV in host RAM, RX 9070 XT (selector measured, gate unproven)</text>

<!-- Macro Architecture Badge -->
<rect x="710" y="20" width="224" height="42" rx="6" class="box ln" stroke-width="1"/>
<text x="822" y="37" font-size="11.5" text-anchor="middle" class="fg" font-weight="600">3:1 GDN / SGRA Hybrid</text>
<text x="822" y="53" font-size="10.5" text-anchor="middle" class="mu">1-bit / 1.58-bit BitFlip FFN</text>

<!-- Input Token -->
<rect x="28" y="195" width="80" height="48" rx="8" class="box st" stroke-width="1.2"/>
<text x="68" y="217" font-size="13" text-anchor="middle" class="fg" font-weight="600">Token x_t</text>
<text x="68" y="233" font-size="10.5" text-anchor="middle" class="mu">Layer Input</text>
<path d="M108,219 L138,219" fill="none" class="st" stroke-width="1.3" marker-end="url(#arr)"/>

<!-- Projections -->
<rect x="140" y="180" width="95" height="78" rx="8" class="box st" stroke-width="1.2"/>
<text x="187" y="212" font-size="13" text-anchor="middle" class="fg" font-weight="600">q, k, v</text>
<text x="187" y="231" font-size="10" text-anchor="middle" class="mu">Linear Proj</text>

<!-- Branches Split -->
<path d="M235,200 C265,200 270,115 295,115" fill="none" class="st" stroke-width="1.3" marker-end="url(#arr)"/>
<path d="M235,225 C265,225 270,250 295,250" fill="none" class="st" stroke-width="1.3" marker-end="url(#arr)"/>

<!-- Branch 1: Sliding Window Attention -->
<rect x="298" y="70" width="220" height="90" rx="8" class="twin swin" stroke-width="1.5"/>
<text x="408" y="94" font-size="13.5" text-anchor="middle" class="win" font-weight="700">1. Sliding Window Attention</text>
<text x="408" y="114" font-size="11.5" text-anchor="middle" class="fg">4 sinks + 2048 token local window</text>
<text x="408" y="132" font-size="11" text-anchor="middle" class="mu">GPU VRAM: 32 MB (Constant O(1))</text>
<text x="408" y="149" font-size="10.5" text-anchor="middle" class="win mono">o_win, LSE_win</text>

<!-- Branch 2: Delta-Rule Recurrent Memory -->
<rect x="298" y="205" width="220" height="95" rx="8" class="tmem smem" stroke-width="1.5"/>
<text x="408" y="228" font-size="13.5" text-anchor="middle" class="mem" font-weight="700">2. Delta-Rule State (GDN)</text>
<text x="408" y="248" font-size="11" text-anchor="middle" class="fg">S_t = α·S + β·(v − S·k) ⊗ k</text>
<text x="408" y="266" font-size="11" text-anchor="middle" class="mu">Zero-cost prediction error: δ = v − S·k</text>
<text x="408" y="284" font-size="10.5" text-anchor="middle" class="mem mono">o_mem, ||S·q|| (confidence)</text>

<!-- Token FIFO Shift to Memory -->
<path d="M408,160 L408,203" fill="none" class="smem" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-mem)"/>
<text x="414" y="184" font-size="10" class="mem">Token leaves window → written to S_t</text>

<!-- The Surprise Gate Module -->
<rect x="555" y="135" width="160" height="150" rx="10" class="alert salert" stroke-width="1.8"/>
<text x="635" y="159" font-size="13" text-anchor="middle" class="sink" font-weight="700">Surprise Gate g_t</text>
<text x="635" y="177" font-size="10.5" text-anchor="middle" class="fg mono">f = [LSE, ResMass, ||S·q||]</text>
<text x="635" y="195" font-size="10.5" text-anchor="middle" class="fg mono">g_t = σ(w_g^T f + b)</text>
<line x1="570" y1="205" x2="700" y2="205" class="ln" stroke-width="1"/>
<text x="635" y="224" font-size="11" text-anchor="middle" class="win" font-weight="600">g_t ≤ τ : Fast-Path</text>
<text x="635" y="239" font-size="10" text-anchor="middle" class="mu">No PCIe, 0 Host DMA</text>
<text x="635" y="259" font-size="11" text-anchor="middle" class="keep" font-weight="600">g_t &gt; τ : Slow-Path</text>
<text x="635" y="274" font-size="10" text-anchor="middle" class="mu">Trigger Host DMA</text>

<!-- Connectors to Gate -->
<path d="M518,125 C538,125 540,155 553,155" fill="none" class="swin" stroke-width="1.3" marker-end="url(#arr-win)"/>
<path d="M518,255 C538,255 540,240 553,240" fill="none" class="smem" stroke-width="1.3" marker-end="url(#arr-mem)"/>

<!-- Slow-Path Trigger to Host Memory -->
<path d="M635,285 L635,338" fill="none" class="skeep" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr-keep)"/>
<text x="643" y="318" font-size="10.5" class="keep" font-weight="600">Trigger Read</text>

<!-- Host RAM & S8 Shortlist Area -->
<rect x="28" y="345" width="904" height="110" rx="10" class="tkeep skeep" stroke-width="1.4"/>
<text x="45" y="368" font-size="13" class="keep" font-weight="700">S8 Quantized Shortlist Index &amp; Host-RAM KV Streaming (PCIe 4.0)</text>
<text x="45" y="386" font-size="11" class="mu">1M Context: 16 GB KV Cache in Host System RAM · GPU stores block summaries (prototype S8 box: 8.5 MiB/group/layer; planned 4-bit centroid + rerank)</text>

<!-- S8 GPU Shortlist Box -->
<rect x="45" y="398" width="230" height="44" rx="6" class="box ln" stroke-width="1"/>
<text x="160" y="417" font-size="11.5" text-anchor="middle" class="fg" font-weight="600">S8 Quantized Leaf Summaries</text>
<text x="160" y="433" font-size="10" text-anchor="middle" class="win">8.5 MiB/group/layer (0.29 ms Vulkan)</text>

<path d="M275,420 L305,420" fill="none" class="st" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- Shortlist 64 Box -->
<rect x="310" y="398" width="210" height="44" rx="6" class="box ln" stroke-width="1"/>
<text x="415" y="417" font-size="11.5" text-anchor="middle" class="fg" font-weight="600">Shortlist-64 Filter</text>
<text x="415" y="433" font-size="10" text-anchor="middle" class="mu">100% exact top-16 certified</text>

<path d="M520,420 L550,420" fill="none" class="st" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- Exact KV Blocks DMA Box -->
<rect x="555" y="398" width="360" height="44" rx="6" class="box ln" stroke-width="1"/>
<text x="735" y="417" font-size="11.5" text-anchor="middle" class="keep" font-weight="600">Top-k KV Blocks DMA Transfer (PCIe 4.0 x16)</text>
<text x="735" y="433" font-size="10" text-anchor="middle" class="mu">24 MB transfer in 0.96 ms · &lt; 3.2% decode step overhead</text>

<!-- Return Path to Mix -->
<path d="M780,210 L810,210" fill="none" class="st" stroke-width="1.3" marker-end="url(#arr)"/>

<!-- Final Token Mix & Output -->
<rect x="760" y="160" width="100" height="85" rx="35" class="box st" stroke-width="1.3"/>
<text x="810" y="195" font-size="13" text-anchor="middle" class="fg" font-weight="700">Adaptive</text>
<text x="810" y="213" font-size="13" text-anchor="middle" class="fg" font-weight="700">Mixer</text>
<text x="810" y="230" font-size="9.5" text-anchor="middle" class="mu mono">o_win+γ_m·o_m+g·o_r</text>

<path d="M860,202 L885,202" fill="none" class="st" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="888" y="180" width="45" height="45" rx="6" class="box st" stroke-width="1.2"/>
<text x="910" y="207" font-size="12" text-anchor="middle" class="fg" font-weight="600">Out</text>

<!-- Footer Banner -->
<text x="28" y="492" font-size="11" class="mu">Measured on: AMD Radeon RX 9070 XT 16 GB (Vulkan) + AMD Ryzen 7 7800X3D · Valerois Research (Heimdall &amp; Gjallar)</text>
<text x="930" y="492" font-size="11" text-anchor="end" class="win" font-weight="600">1M tokens · window 32 MB + S8 index (O(N), ~136 MiB for 27B, calc)</text>

</svg>
